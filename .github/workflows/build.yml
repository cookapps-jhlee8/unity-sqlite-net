name: Build native libraries
on: [push, pull_request]
defaults:
  run:
    shell: bash

env:
  DOCKER_CACHE: ${{ github.workspace }}/.docker-cache

jobs:
  build_with_docker:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:          
          - platform: linux
            target: docker-all-linux
          - platform: android
            target: docker-all-android
    steps:
      - uses: actions/checkout@v3
      - name: Cache Docker files
        uses: actions/cache@v4
        with:
          path: $DOCKER_CACHE
          key: ${{ matrix.platform }}
      - name: Build
        run: make -C Plugins ${{ matrix.target }} DOCKER_BUILD_ARGS="--cache-from type=gha --cache-to type=gha,mode=max"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilzoide-sqlite-net-${{ matrix.platform }}
          path: |            
            Plugins/lib/${{ matrix.platform }}/**/*.dll
            Plugins/lib/${{ matrix.platform }}/**/*.dylib
            Plugins/lib/${{ matrix.platform }}/**/*.so            

  build_with_windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup MSYS2 and OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl

      - name: Build with mingw
        shell: msys2 {0}
        env:
          CFLAGS: "-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -Isqlite-amalgamation -I/mingw64/include"
          LDFLAGS: "-L/mingw64/lib -lcrypto"
        run: |
          cd Plugins
          make windows-mingw-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilzoide-sqlite-net-windows
          path: Plugins/lib/windows/x86_64/*.dll
        
  build_with_macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          brew install perl make

      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          git checkout openssl-3.4.1

      - name: Build OpenSSL for arm64
        run: |
          cd openssl
          ./Configure darwin64-arm64-cc no-shared no-tests --prefix=$PWD/build/arm64
          make clean
          make -j$(sysctl -n hw.ncpu)
          make install_sw

      - name: Build OpenSSL for x86_64
        run: |
          cd openssl
          ./Configure darwin64-x86_64-cc no-shared no-tests --prefix=$PWD/build/x86_64
          make clean
          make -j$(sysctl -n hw.ncpu)
          make install_sw

      - name: Create fat (universal) OpenSSL libraries
        run: |
          cd openssl
          mkdir -p build/universal/lib
          lipo -create \
            build/arm64/lib/libcrypto.a \
            build/x86_64/lib/libcrypto.a \
            -output build/universal/lib/libcrypto.a
          lipo -create \
            build/arm64/lib/libssl.a \
            build/x86_64/lib/libssl.a \
            -output build/universal/lib/libssl.a
          cp -R build/arm64/include build/universal/include

      - name: Check OpenSSL paths
        run: |
          ls -la openssl/build/universal/lib/
          ls -la openssl/build/universal/include/openssl/
          # openssl 경로 확인
          echo "OpenSSL 라이브러리 존재 여부: $(test -f openssl/build/universal/lib/libcrypto.a && echo 'Yes' || echo 'No')"
          echo "OpenSSL 헤더 존재 여부: $(test -f openssl/build/universal/include/openssl/crypto.h && echo 'Yes' || echo 'No')"

      - name: Build
        env:
          CFLAGS: "-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -Isqlite-amalgamation -I${{ github.workspace }}/openssl/build/universal/include"
          LDFLAGS: "-L${{ github.workspace }}/openssl/build/universal/lib -lcrypto"
        run: |
          # 디렉토리 구조 확인
          find openssl/build -type d | sort
          find openssl/build -name "*.a" | sort
          # GitHub Actions 환경에서는 상대 경로를 절대 경로로 대체
          cd Plugins
          make all-apple OPENSSL_DIR="${{ github.workspace }}/openssl"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilzoide-sqlite-net-macos
          path: |
            Plugins/lib/macos/*.dylib

  build_with_ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: brew install perl make
      
      - name: Clone OpenSSL
        run: |
          git clone --depth=1 --branch openssl-3.0.12 https://github.com/openssl/openssl.git
          cd openssl
      
      - name: Build OpenSSL for iOS
        run: |
          cd openssl
          
          # SDK 경로 확인
          IPHONEOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK Path: $IPHONEOS_SDK_PATH"
          
          # 헤더 파일 경로 설정 및 환경 변수 (XCode 15.4 호환성)
          export SDKROOT=$IPHONEOS_SDK_PATH
          export CFLAGS="-I$SDKROOT/usr/include -isysroot $SDKROOT"
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $SDKROOT)
          export PATH="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin:$PATH"
          
          # 디버그 정보
          echo "CROSS_TOP: $CROSS_TOP"
          echo "CROSS_SDK: $CROSS_SDK"
          echo "CFLAGS: $CFLAGS"
          
          # Configure 명령에 명시적으로 SDK 경로와 플래그 지정
          ./Configure ios64-xcrun no-shared no-tests no-stdio no-ui \
            --prefix=$PWD/build/ios-arm64 \
            -isysroot $SDKROOT \
            $CFLAGS
          
          # 빌드 수행
          make clean
          make -j$(sysctl -n hw.ncpu) CFLAGS="$CFLAGS"
          make install_sw
          
          # 결과물 확인
          ls -la build/ios-arm64/lib
          ls -la build/ios-arm64/include/openssl
      
      - name: Build SQLite for iOS
        env:
          CFLAGS: "-DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -Isqlite-amalgamation -I${{ github.workspace }}/openssl/build/ios-arm64/include"
          LDFLAGS: "-L${{ github.workspace }}/openssl/build/ios-arm64/lib -lcrypto"
        run: make -C Plugins all-ios
      
      - name: Check Build Output
        run: |
          ls -la Plugins/lib/ios/arm64
          ls -la Plugins/lib/ios
          file Plugins/lib/ios/libgilzoide-sqlite-net.a
          file Plugins/lib/ios/arm64/libgilzoide-sqlite-net.a
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gilzoide-sqlite-net-ios
          path: |
            Plugins/lib/ios/*.a
            Plugins/lib/ios/*/*.a
